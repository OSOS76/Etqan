<article class="course-card">
  <div class="course-image-wrapper">
    <img src="assets/images/course-placeholder.png" alt="الدورة" class="course-image" />
    <span class="course-badge">قيد التقدم</span>
  </div>

  <div class="course-content">
    <h3 class="course-title">الرياضيات المتقدمة</h3>
    <p class="course-teacher">د. سارة جونسون</p>

    <div class="progress-wrapper">
      <div class="progress-info">
        <span class="progress-label">التقدم</span>
        <span class="progress-percentage">68%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: 68%"></div>
      </div>
    </div>

    <button class="btn-continue" type="button">
      <i class="fas fa-arrow-left"></i>
      متابعة
    </button>
  </div>
</article>
