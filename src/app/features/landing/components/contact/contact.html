<section
  class="contact-section py-5 my-5"
  id="contact"
  dir="rtl"
  aria-labelledby="contact-heading"
>
  <div class="container">
    <header class="contact-section__header text-center mx-auto mb-5" data-aos="fade-up">
      <span class="badge rounded-pill bg-light text-primary border px-3 py-2 mb-2 fw-bold">تواصل مباشر</span>
      <h2 id="contact-heading" class="contact-section__title fw-extrabold mb-3">
        تواصل معنا
      </h2>
      <p class="contact-section__subtitle text-muted mb-0">
        يسعدنا دائماً الرد على كافة استفساراتكم ومساعدتكم.
      </p>
    </header>

    <div class="row g-4 g-lg-5 align-items-stretch">
      <div class="col-lg-6" data-aos="fade-right" data-aos-delay="150">
        <div class="contact-section__form-card h-100">
          <h3 class="contact-section__card-title fw-bold mb-4">أرسل رسالتك</h3>
          <form class="contact-section__form" action="#" method="post">
            <div class="mb-3">
              <label for="contact-name" class="contact-section__label form-label">الاسم الكامل</label>
              <input
                type="text"
                class="form-control contact-section__input"
                id="contact-name"
                name="name"
                placeholder="أدخل اسمك الكامل"
                required
              />
            </div>
            <div class="mb-3">
              <label for="contact-email" class="contact-section__label form-label">
                البريد الإلكتروني
              </label>
              <input
                type="email"
                class="form-control contact-section__input"
                id="contact-email"
                name="email"
                placeholder="example@email.com"
                required
              />
            </div>
            <div class="mb-4">
              <label for="contact-message" class="contact-section__label form-label">الرسالة</label>
              <textarea
                class="form-control contact-section__input contact-section__textarea"
                id="contact-message"
                name="message"
                rows="5"
                placeholder="اكتب استفسارك أو رسالتك هنا..."
                required
              ></textarea>
            </div>
            <button type="submit" class="btn btn-primary-custom contact-section__submit w-100 py-2.5">
              <span>إرسال الرسالة</span>
              <i class="fa-solid fa-paper-plane ms-2" aria-hidden="true"></i>
            </button>
          </form>
        </div>
      </div>

      <div class="col-lg-6" data-aos="fade-left" data-aos-delay="250">
        <aside class="contact-section__info-card h-100">
          <h3 class="contact-section__card-title fw-bold mb-4">معلومات التواصل</h3>
          <ul class="contact-section__info-list list-unstyled mb-4">
            <li class="contact-section__info-item">
              <span class="contact-section__info-icon" aria-hidden="true">
                <i class="fa-solid fa-phone"></i>
              </span>
              <div>
                <span class="contact-section__info-label d-block">الهاتف</span>
                <a href="tel:+966501234567" class="contact-section__info-value">+966 50 123 4567</a>
              </div>
            </li>
            <li class="contact-section__info-item">
              <span class="contact-section__info-icon" aria-hidden="true">
                <i class="fa-solid fa-envelope"></i>
              </span>
              <div>
                <span class="contact-section__info-label d-block">البريد الإلكتروني</span>
                <a href="mailto:info@etqan.com" class="contact-section__info-value">info@etqan.com</a>
              </div>
            </li>
            <li class="contact-section__info-item">
              <span class="contact-section__info-icon" aria-hidden="true">
                <i class="fa-solid fa-location-dot"></i>
              </span>
              <div>
                <span class="contact-section__info-label d-block">العنوان</span>
                <span class="contact-section__info-value">الرياض، المملكة العربية السعودية</span>
              </div>
            </li>
            <li class="contact-section__info-item">
              <span class="contact-section__info-icon" aria-hidden="true">
                <i class="fa-solid fa-clock"></i>
              </span>
              <div>
                <span class="contact-section__info-label d-block">ساعات العمل</span>
                <span class="contact-section__info-value">الأحد – الخميس: 9:00 ص – 6:00 م</span>
              </div>
            </li>
          </ul>
          <div class="contact-section__social mt-auto">
            <span class="contact-section__social-label d-block mb-3">تابعنا على شبكات التواصل</span>
            <div class="contact-section__social-links d-flex flex-wrap gap-2">
              <a
                href="https://facebook.com"
                class="contact-section__social-link"
                aria-label="Facebook"
                target="_blank"
                rel="noopener noreferrer"
              >
                <i class="fa-brands fa-facebook-f"></i>
              </a>
              <a
                href="https://instagram.com"
                class="contact-section__social-link"
                aria-label="Instagram"
                target="_blank"
                rel="noopener noreferrer"
              >
                <i class="fa-brands fa-instagram"></i>
              </a>
              <a
                href="https://linkedin.com"
                class="contact-section__social-link"
                aria-label="LinkedIn"
                target="_blank"
                rel="noopener noreferrer"
              >
                <i class="fa-brands fa-linkedin-in"></i>
              </a>
              <a
                href="https://wa.me/966501234567"
                class="contact-section__social-link"
                aria-label="WhatsApp"
                target="_blank"
                rel="noopener noreferrer"
              >
                <i class="fa-brands fa-whatsapp"></i>
              </a>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </div>
</section>
