<section
  class="statistics-section py-5 my-5"
  id="statistics"
  dir="rtl"
  aria-labelledby="statistics-heading"
>
  <div class="container">
    <header class="statistics-section__header text-center mx-auto mb-5" data-aos="fade-up">
      <span class="badge rounded-pill bg-light text-primary border px-3 py-2 mb-2 fw-bold">إحصائيات إتقان</span>
      <h2 id="statistics-heading" class="statistics-section__title fw-extrabold mb-3">
        إتقان بالأرقام
      </h2>
      <p class="statistics-section__subtitle text-muted mb-0">
        نفخر بثقة وتفاعل آلاف الطلاب والمدرسين عبر المنصة.
      </p>
    </header>

    <div class="row g-4 g-lg-5">
      <div class="col-6 col-lg-3 d-flex" data-aos="zoom-in" data-aos-delay="100">
        <article class="statistics-section__card w-100 text-center">
          <div class="statistics-section__icon-wrap mx-auto" aria-hidden="true">
            <i class="fa-solid fa-user-graduate"></i>
          </div>
          <p class="statistics-section__number fw-extrabold mb-2">+5,000</p>
          <p class="statistics-section__label mb-0">طالب نشط</p>
        </article>
      </div>

      <div class="col-6 col-lg-3 d-flex" data-aos="zoom-in" data-aos-delay="250">
        <article class="statistics-section__card w-100 text-center">
          <div class="statistics-section__icon-wrap mx-auto" aria-hidden="true">
            <i class="fa-solid fa-chalkboard-user"></i>
          </div>
          <p class="statistics-section__number fw-extrabold mb-2">+250</p>
          <p class="statistics-section__label mb-0">مدرس معتمد</p>
        </article>
      </div>

      <div class="col-6 col-lg-3 d-flex" data-aos="zoom-in" data-aos-delay="400">
        <article class="statistics-section__card w-100 text-center">
          <div class="statistics-section__icon-wrap mx-auto" aria-hidden="true">
            <i class="fa-solid fa-book-open"></i>
          </div>
          <p class="statistics-section__number fw-extrabold mb-2">+1,200</p>
          <p class="statistics-section__label mb-0">كورس تفاعلي</p>
        </article>
      </div>

      <div class="col-6 col-lg-3 d-flex" data-aos="zoom-in" data-aos-delay="550">
        <article class="statistics-section__card w-100 text-center">
          <div class="statistics-section__icon-wrap mx-auto" aria-hidden="true">
            <i class="fa-solid fa-face-smile"></i>
          </div>
          <p class="statistics-section__number fw-extrabold mb-2">98%</p>
          <p class="statistics-section__label mb-0">نسبة رضا المستخدمين</p>
        </article>
      </div>
    </div>
  </div>
</section>
