<section class="add-course-page" (click)="close()">
  <div class="add-course-card" (click)="$event.stopPropagation()">
    <h2 class="page-title">
      {{ course() ? 'تعديل الدورة' : 'إنشاء دورة جديدة' }}
    </h2>
    <p class="page-subtitle">أدخل بيانات الدورة أدناه</p>

    <form class="course-form" [formGroup]="courseForm" (ngSubmit)="addCourse()">
      <div class="form-group">
        <label class="form-label" for="title">عنوان الدورة</label>
        <input
          id="title"
          type="text"
          class="form-input"
          placeholder="مثال: الرياضيات المتقدمة"
          name="title"
          formControlName="title"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="description">وصف الدورة</label>
        <textarea
          id="description"
          class="form-input form-textarea"
          placeholder="أدخل وصفاً تفصيلياً للدورة..."
          name="description"
          formControlName="description"
        ></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">السنه الدراسيه</label>
        <select class="form-select" formControlName="grade">
          <option value="" disabled>اختر السنه</option>
          <option value="الاول الثانوي" selected>الاول الثانوي</option>
          <option value=" الثاني الثانوي">الثاني الثانوي</option>
          <option value="الثالث الثانوي">الثالث الثانوي</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">الماده</label>
          <select class="form-select" formControlName="subject">
            <option value="" disabled selected>اختر الماده</option>
            <option value="علوم">علوم</option>
            <option value="رياضيات">رياضيات</option>
            <option value="لغة عربية">لغة عربية</option>
            <option value="لغة انجليزية">لغة انجليزية</option>
            <option value="تاريخ">تاريخ</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="price">السعر</label>
          <input id="price" type="number" lang="eng" class="form-input" formControlName="price" />
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">
          {{ course() ? 'حفظ التعديلات' : 'إنشاء الدورة' }}
        </button>
        <!-- <button type="button" class="btn-cancel">إلغاء</button> -->
      </div>
    </form>
  </div>
</section>
