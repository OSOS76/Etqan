<div class="your-courses-page">
  <div class="container-fluid px-4">
    <div class="d-flex flex-wrap justify-content-between mb-4">
      <div class="">
        <h2 class="page-title">دوراتي</h2>
        <p class="page-subtitle">إدارة ومتابعة الدورات التي قمت بإنشائها</p>
      </div>
      <div class="">
        <button class="btn btn-primary-custom float-end m-2" type="button" (click)="loadCourses()">
          <i class="fas fa-rotate-right me-2"></i>
          تحديث
        </button>
        <button
          class="btn btn-primary-custom float-end m-2"
          type="button"
          (click)="isAddCourseOpen = true"
        >
          <i class="fas fa-plus me-2"></i>
          إنشاء دورة جديدة
        </button>
        @if (isAddCourseOpen == true) {
          <app-add-course
            [course]="selectedCourse"
            (closeModal)="isAddCourseOpen = false"
          ></app-add-course>
        }
      </div>
    </div>

    <div class="row g-4">
      @for (item of courses; track $index) {
        <div class="col- col-md-6 col-lg-4">
          <div class="card course-card h-100">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start mb-3">
                <span class="badge badge-status bg-success">نشطة</span>
                <div class="dropdown">
                  <button
                    class="btn btn-sm btn-light"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                  >
                    <i class="fas fa-ellipsis-v"></i>
                  </button>

                  <ul class="dropdown-menu">
                    <li>
                      <button class="dropdown-item" (click)="editCourse(item)">
                        <i class="fas fa-edit me-2"></i>
                        تعديل
                      </button>
                    </li>

                    <li>
                      <button class="dropdown-item text-danger" (click)="deleteCourse(item)">
                        <i class="fas fa-trash me-2"></i>
                        حذف
                      </button>
                    </li>
                  </ul>
                </div>
              </div>

              <h5 class="card-title">{{ item.title }}</h5>
              <p class="card-text text-muted">{{ item.description }}</p>

              <div class="d-flex align-items-center gap-3 mb-3">
                <span class="text-muted small">
                  <i class="far fa-user me-1"></i>
                  {{ item.grade }}
                </span>
                <span class="text-muted small">
                  <i class="fa-solid fa-dollar-sign"></i> {{ item.price }}
                </span>
              </div>

              <div class="progress-wrapper mb-3">
                <div class="d-flex justify-content-between mb-2">
                  <span class="progress-label">التقدم</span>
                  <span class="progress-percentage">68%</span>
                </div>
                <div class="progress">
                  <div
                    class="progress-bar"
                    role="progressbar"
                    style="width: 68%"
                    aria-valuenow="68"
                    aria-valuemin="0"
                    aria-valuemax="100"
                  ></div>
                </div>
              </div>

              <button class="btn btn-primary-custom w-100" type="button">
                <i class="fas fa-eye ms-2"></i>
                عرض الدورة
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
