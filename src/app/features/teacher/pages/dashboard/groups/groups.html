<div class="your-courses-page">
  <div class="container-fluid px-4">
    <div class="d-flex flex-wrap justify-content-between mb-4">
      <div class="">
        <h2 class="page-title">المجموعات</h2>
        <p class="page-subtitle">إدارة ومتابعة المجموعات الدراسية</p>
      </div>
      <div class="">
        <button class="btn btn-primary-custom float-end m-2" type="button" (click)="loadGroup()">
          <i class="fas fa-rotate-right me-2"></i>
          تحديث
        </button>
        <button class="btn btn-primary-custom float-end m-2" type="button" (click)="openAddGroup()">
          <i class="fas fa-plus me-2"></i>
          إنشاء مجموعة جديدة
        </button>
        @if (isAddGroupOpen) {
          <app-add-group
            [courses]="courses"
            (closeModal)="isAddGroupOpen = false"
            [groups]="selectedGroup"
          />
        }
      </div>
    </div>

    <div class="row g-4">
      @for (item of groups; track item.id) {
        <div class="col-md-6 col-lg-4">
          <div class="card group-card h-100">
            <div class="group-card__gradient-top"></div>
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start mb-3">
                <span class="badge badge-status bg-success"> نشطة </span>

                <div class="dropdown">
                  <button
                    class="btn btn-sm btn-light dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                  >
                    <i class="fas fa-ellipsis-v"></i>
                  </button>

                  <ul class="dropdown-menu">
                    <li>
                      <button class="dropdown-item" type="button" (click)="editgroup(item)">
                        <i class="fas fa-edit me-2"></i>
                        تعديل
                      </button>
                    </li>

                    <li>
                      <button
                        class="dropdown-item text-danger"
                        type="button"
                        (click)="deleteGroup(item)"
                      >
                        <i class="fas fa-trash me-2"></i>
                        حذف
                      </button>
                    </li>
                  </ul>
                </div>
              </div>

              <div class="group-card__icon-wrap mb-3">
                <i class="fas fa-users"></i>
              </div>

              <h5 class="card-title group-card__title">
                {{ item.name }}
              </h5>

              <p class="card-text text-muted group-card__location">
                <i class="fas fa-location-dot me-1"></i>
                {{ item.location }}
              </p>

              <div class="d-flex align-items-center gap-3 mb-3">
                <span class="text-muted small group-card__meta">
                  <i class="far fa-user me-1"></i>
                  {{ item.maxStudents }} طالب
                </span>

                <span class="text-muted small group-card__meta">
                  <i class="fa-solid fa-clock me-1"></i>
                  {{ item.schedule }}
                </span>
              </div>

              <div class="progress-wrapper mb-3">
                <div class="d-flex justify-content-between mb-2">
                  <span class="progress-label"> التقدم </span>

                  <span class="progress-percentage"> 68% </span>
                </div>

                <div class="progress">
                  <div
                    class="progress-bar"
                    role="progressbar"
                    style="width: 68%"
                    aria-valuenow="68"
                    aria-valuemin="0"
                    aria-valuemax="100"
                  ></div>
                </div>
              </div>

              <button class="btn btn-primary-custom group-card__btn w-100" type="button">
                <i class="fas fa-eye ms-2"></i>
                عرض المجموعة
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
